name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fmu]"
          pip install graphviz

      - name: Run linting with Ruff
        run: |
          ruff check syssimx/ syssimx_examples/ tests/

      - name: Run type checking with MyPy
        if: matrix.python-version == '3.13'
        run: |
          mypy syssimx/ --ignore-missing-imports --python-version 3.13

      - name: Run tests with coverage
        run: |
          pytest tests/unit/ tests/integration/ -m "not fem and not slow" --cov=syssimx --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-fem:
    # Runs the ngsolve-gated FEM suite and the lightweight real-backend
    # FEM/FMU/OpenSim switching test. The main job skips marker "fem".
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-backends-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-backends-

      - name: Install real backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fmu,fem,opensim]"

      - name: Run FEM and real-backend switching tests
        run: |
          pytest -m fem -v

  notebooks:
    # Executes the switching notebooks that need no simulation backend.
    #
    # docs/conf.py sets nb_execution_mode = "off", so Sphinx publishes whatever
    # outputs a notebook already carries. Without this job an API change can
    # break a tutorial silently, or a notebook can be published with no
    # outputs at all, and every other job still passes.
    #
    # Not covered here: the two master-pendulum tutorials under
    # docs/04_tool_integration/04_master_pendulum/. They execute end-to-end
    # against the Euler FMU, but their default CVODE FMU corrupts the heap
    # when its native instance is freed, so they cannot be gated yet.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install the LaTeX toolchain
        # notebooks/plot_setup.py renders thesis-style figures with usetex and
        # siunitx, so the verification notebook needs a real LaTeX install.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra texlive-science dvipng cm-super

      - name: Execute backend-free switching notebooks
        run: |
          pytest --nbmake --nbmake-timeout=900 \
            docs/03_core_tutorials/03_advanced/04_multi_component_switching.ipynb \
            notebooks/03_multi_comp_verification.ipynb

  docs:
    runs-on: ubuntu-latest
    env:
      SYSSIMX_DOCS_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build documentation with warnings as errors
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

  build:
    runs-on: ubuntu-latest
    needs: [test, docs]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
