[pytest]
# Test discovery
testpaths = 
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --capture=no
    -ra

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, multiple components)
    slow: Slow tests (skip with -m "not slow")
    fmu: Tests requiring FMU files
    fem: Tests requiring NGSolve/FEM
    opensim: Tests requiring OpenSim
    requires_fmi: tests that require fmpy / FMI stack

# Coverage (if using pytest-cov)
# addopts = --cov=SysSimX --cov-report=html --cov-report=term

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning:webgui_jupyter_widgets