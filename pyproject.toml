[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syssimx"
version = "0.1.0"
description = "A Python framework for heterogeneous system co-simulation (Modelica FMUs, OpenSim, FEM)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Florian Frech", email = "florianfrech@outlook.de" }
]
keywords = ["simulation", "co-simulation", "FMU", "FEM", "OpenSim", "Modelica"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pint>=0.20.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",        # Used in demos and plotting
    "ipywidgets>=8.0.0",        # Used in UI components
    "traitlets>=5.9.0",         # Used in PendulumMonitoringState
]

[project.optional-dependencies]
# FMI/Modelica support
fmi = [
    "fmpy>=0.3.0",
    "OMPython>=3.4.0",          # For OMPython examples
]

# FEM support (NGSolve)
fem = [
    "ngsolve>=6.2.0",
    "netgen>=6.2.0",            # NGSolve dependency
]

# OpenSim support
opensim = [
    "opensim==4.5.0",           # Exact version pin for compatibility
]

# Visualization
viz = [
    "graphviz>=0.20.0",         # For system graph visualization
    "pydot>=1.4.0",             # Alternative graph rendering
]

# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
]

# Complete installation with all features
all = [
    "syssimx[fmi,fem,opensim,viz]",
]

# Complete development environment
full = [
    "syssimx[all,dev]",
]

[project.urls]
Homepage = "https://github.com/FlorianFrech/SystemSimulation"
Documentation = "https://github.com/FlorianFrech/SystemSimulation/docs"
Repository = "https://github.com/FlorianFrech/SystemSimulation"
Issues = "https://github.com/FlorianFrech/SystemSimulation/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["syssimx*"]  # Match actual package name (lowercase)
exclude = ["tests*", "demos*", "examples*", "docs*"]

[tool.setuptools.package-data]
syssimx = [
    "py.typed",  # PEP 561 type marker
]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
    "--capture=no",
    "-ra",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, multiple components)",
    "slow: Slow tests (skip with -m 'not slow')",
    "fmu: Tests requiring FMU files",
    "fem: Tests requiring NGSolve/FEM",
    "opensim: Tests requiring OpenSim",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Ruff linter configuration
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "demos",
    "examples",
    "docs",
    "syssimx.egg-info",
    "**/*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N803",  # argument name should be lowercase (we use physics notation)
    "N806",  # variable in function should be lowercase
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__

# MyPy type checking configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set true when you add more type hints
ignore_missing_imports = true  # Ignore missing stubs for FEM/OpenSim
exclude = "^(syssimx/viz/)"

[[tool.mypy.overrides]]
module = [
    "fmpy.*",
    "ngsolve.*",
    "opensim.*",
    "OMPython.*",
]
ignore_missing_imports = true

# Coverage configuration (if using pytest-cov)
[tool.coverage.run]
source = ["syssimx"]
omit = [
    "*/tests/*",
    "*/demos/*",
    "*/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
