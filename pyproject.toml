[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syssimx"
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "pint",
    "networkx",
    "pandas",
    "matplotlib",        # Used in demos and plotting
    "ipywidgets",        # Used in UI components
    "traitlets",         # Used in PendulumMonitoringState
    "graphviz",         # For system graph visualization
    "pydot",            # Alternative graph rendering
    "pyyaml",           # Declarative system descriptions (syssimx.system.loader)
]
requires-python = ">=3.11"
authors = [
    { name = "Florian Frech", email = "florianfrech@outlook.de" }
]
description = "A Python framework for heterogeneous hybrid co-simulation with FMI 2.0, OpenSim, and NGSolve structural dynamics."
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "NOTICE",
    "THIRD_PARTY_LICENSES.MD",
    "LICENSES/*.txt",
]
keywords = ["simulation", "co-simulation", "FMU", "FEM", "structural dynamics", "OpenSim", "Modelica"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
syssimx = "syssimx.cli:main"

[project.optional-dependencies]
# FMI/Modelica support
fmu = [
    "fmpy",
    "OMPython>=4.0.0",          # For OMPython examples
]

# Transient structural-dynamics FEM support (NGSolve)
fem = [
    "ngsolve",
    "webgui_jupyter_widgets",
]

# OpenSim support
opensim = [
    "opensim>=4.6",
]

# Development tools
# Kept as a pip-compatible extra. The uv development workflow uses the
# mirrored [dependency-groups].dev group below.
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "ipython>=8.12.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "sphinx-book-theme>=1.1.0",
    "myst-nb>=1.1.0",
    "tqdm>=4.66.0",             # progress bars in the benchmark notebooks
]

# Complete installation with all features
all = [
    "syssimx[fmu,fem,opensim]",
]

# Complete development environment
full = [
    "syssimx[all,dev]",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "ipython>=8.12.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "sphinx-book-theme>=1.1.0",
    "myst-nb>=1.1.0",
    "tqdm>=4.66.0",             # progress bars in the benchmark notebooks
]

[project.urls]
Homepage = "https://github.com/FlorianFrech/SystemSimulation"
Documentation = "https://syssimx.readthedocs.io/en/latest/"
Repository = "https://github.com/FlorianFrech/SystemSimulation"
Issues = "https://github.com/FlorianFrech/SystemSimulation/issues"

[tool.uv]
package = true
default-groups = ["dev"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["syssimx*"]  # Match actual package name (lowercase)
exclude = ["tests*", "demos*", "examples*", "docs*", "thesis*", ]

[tool.setuptools]

[tool.setuptools.dynamic]
version = { attr = "syssimx.__version__.__version__" }

[tool.setuptools.package-data]
syssimx = [
    "py.typed",  # PEP 561 type marker
]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
    "--capture=no",
    "-ra",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, multiple components)",
    "slow: Slow tests (skip with -m 'not slow')",
    "fmu: Tests requiring FMU files",
    "fem: Tests requiring NGSolve/FEM",
    "opensim: Tests requiring OpenSim",
    "requires_fmi: tests that require fmpy / FMI stack",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning:webgui_jupyter_widgets",
    "ignore::pytest.PytestCacheWarning",
]

# Ruff linter configuration
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "demos",
    "examples",
    "docs",
    "syssimx.egg-info",
    "**/*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N803",  # argument name should be lowercase (we use physics notation)
    "N806",  # variable in function should be lowercase
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__

# MyPy type checking configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set true when you add more type hints
ignore_missing_imports = true  # Ignore missing stubs for FEM/OpenSim
exclude = "^(syssimx/viz/)"

[[tool.mypy.overrides]]
module = [
    "fmpy.*",
    "ngsolve.*",
    "opensim.*",
    "OMPython.*",
    "yaml.*",
]
ignore_missing_imports = true

# Coverage configuration (if using pytest-cov)
[tool.coverage.run]
source = ["syssimx"]
omit = [
    "*/tests/*",
    "*/demos/*",
    "*/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
