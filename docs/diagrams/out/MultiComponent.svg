link MultiComponent to StateAdapter--><path d="M244.38,252 C273.26,252 304.51,252 334.59,252 " fill="none" id="MultiComponent-&gt;StateAdapter" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="339.8,252,330.8,248,334.8,252,330.8,256,339.8,252" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="10" lengthAdjust="spacingAndGlyphs" textLength="40" x="272" y="246.69">may use</text><!--MD5=[cea0369ac7d7ca2b50e17e1493ef27c2]
@startuml MultiComponent


skinparam classAttributeIconSize 0
skinparam padding 2
skinparam defaultFontSize 10
skinparam classFontSize 11
skinparam nodesep 30
skinparam ranksep 50

skinparam backgroundColor white

skinparam shadowing false

left to right direction


abstract class MultiComponent <<CoSimComponent>> {
    + models: Dict[ModeKey, CoSimComponent]
    + active_mode: ModeKey
    + active_comp: Optional[CoSimComponent]
    + mode_selector: Optional[Callable]
    + hysteresis: Optional[Hysteresis]
    + state_adapters: Dict[ModeKey, StateAdapter]
    ==
    + __init__(name, initial_mode, group)
    .. Abstract Methods ..
    {abstract} # _register_models(): None
    {abstract} # _adapt_state(state, target_mode): Dict[str, Any]
    .. Initialization ..
    # _initialize_component(t0)
    - _unify_ports()
    .. Mode Switching ..
    # _do_step_internal(t, dt)
    - _switch_mode(new_mode, t)
    .. I/O Delegation ..
    + set_inputs(signals, t)
    # _update_output_states(t)
    .. State Management ..
    + set_state(state, t)
    + get_state(): Dict[str, Any]
    + reset()
}

class Hysteresis {
    + dwell_time: float
    + last_switch_time: float
    + last_mode: ModeKey
    ==
    + __init__(dwell_time)
    + can_switch(t, proposed_mode): bool
    + record_switch(t, new_mode)
}

interface StateAdapter <<Protocol>> {
    {abstract} + adapt_state(source_state, target_component): Dict[str, Any]
}

class ModeKey <<str>> {
    Mode identifier
    e.g., "FEM", "OpenSim", "EQB"
}

MultiComponent -down-> Hysteresis : uses
MultiComponent -down-> ModeKey : uses
MultiComponent -down-> StateAdapter : may use

@enduml

