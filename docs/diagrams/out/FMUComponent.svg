link ModelDescription to ModelVariable--><path d="M403.71,121 C430.5,121 461.82,121 488.63,121 " fill="none" id="ModelDescription-&gt;ModelVariable" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="493.93,121,484.93,117,488.93,121,484.93,125,493.93,121" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="10" lengthAdjust="spacingAndGlyphs" textLength="17" x="454" y="115.69">has</text><!--MD5=[be1cf9e451970283aa481c2eae2b93ba]
@startuml FMUComponent


skinparam classAttributeIconSize 0
skinparam padding 2
skinparam defaultFontSize 10
skinparam classFontSize 11
skinparam nodesep 40
skinparam ranksep 40

skinparam backgroundColor white

skinparam shadowing false

left to right direction


class FMUComponent <<CoSimComponent>>{
    + state: Dict[str, Any]
    - _path: str
    - _md: ModelDescription
    - _md_vars: Dict[str, ModelVariable]
    - _instance: Optional[FMU2Slave]
    - _unzipdir: Optional[str]
    - _vrs_in: Dict[str, int]
    - _vrs_out: Dict[str, int]
    ==
    + __init__(name, fmu_path, group)
    .. Build ..
    - _build_port_specs()
    - _build_value_reference_map()
    .. Init ..
    # _initialize_component(t0)
    - _apply_parameters_starts()
    - _apply_input_starts()
    .. Config ..
    + set_parameters(**parameters)
    .. I/O ..
    + set_inputs(signals, t)
    + get_outputs()
    # _update_output_states(t)
    .. Step ..
    # _do_step_internal(t, dt)
    .. State ..
    + set_state(state, t)
    + get_state()
    + reset()
}

class ModelDescription <<fmpy>> {
    + guid: str
    + fmiVersion: str
    + modelVariables
    + coSimulation
}

class ModelVariable <<fmpy>> {
    + name: str
    + valueReference: int
    + causality: str
    + type: str
    + unit: Optional[str]
    + _python_type: type
}

class FMU2Slave <<fmpy>> {
    + instantiate()
    + setupExperiment(startTime)
    + enterInitializationMode()
    + exitInitializationMode()
    + doStep(t, dt)
    + setReal/Integer/Boolean/String()
    + getReal/Integer/Boolean/String()
    + reset()
}

FMUComponent -down-> ModelDescription: has
FMUComponent -down-> FMU2Slave: has
ModelDescription -down-> ModelVariable: has

@enduml

