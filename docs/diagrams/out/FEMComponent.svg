@startuml FEMComponent


skinparam classAttributeIconSize 0
skinparam padding 2
skinparam defaultFontSize 10
skinparam classFontSize 11
skinparam nodesep 10
skinparam ranksep 10

skinparam backgroundColor white

skinparam shadowing false


abstract class FEMComponent <<CoSimComponent>> {
    + geometry: Optional[Any]
    + mesh: Optional[Any]
    + spaces: Optional[Dict[str, Any]]
    + gfs: Optional[Dict[str, Any]]
    + gfs_history: Optional[Dict[str, Any]]
    + bfa: Optional[Any]
    + lf: Optional[Any]
    + solver: Optional[Any]
    + scene: Optional[Any]
    ==
    + __init__(name, label, group)
    .. Init ..
    {abstract} # _initialize_component(t0)
    .. Step ..
    {abstract} # _do_step_internal(t, dt)
    .. File I/O ..
    + load_mesh_from_file(path)
    + export_results(path, format)
    + visualize_state()
}

@enduml

