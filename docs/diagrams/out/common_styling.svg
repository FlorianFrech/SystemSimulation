<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentScriptType="application/ecmascript" contentStyleType="text/css" height="12px" preserveAspectRatio="none" style="width:12px;height:12px;" version="1.1" viewBox="0 0 12 12" width="12px" zoomAndPan="magnify"><defs/><g><!--MD5=[7d9f08ef5b527cbf2b49d5d9a283da41]
@startuml

skinparam backgroundColor white
skinparam sequenceArrowThickness 2
skinparam roundcorner 5
skinparam participantPadding 100
skinparam wrapWidth 0
skinparam maxMessageSize 500

skinparam sequence {
    ArrowColor #2C3E50
    ActorBorderColor #2C3E50
    LifeLineBorderColor #2C3E50
    LifeLineBackgroundColor #ECF0F1
    
    ParticipantBorderColor #3498DB
    ParticipantBackgroundColor #EBF5FB
    
    BoxBorderColor #95A5A6
    BoxBackgroundColor #F8F9F9
}

skinparam note {
    BorderColor #E67E22
    BackgroundColor #FEF5E7
}

skinparam sequenceGroup {
    BorderColor #27AE60
    BackgroundColor #E8F8F5
}

@enduml

